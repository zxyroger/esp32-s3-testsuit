<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ESP32-S3 摄像头</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0b0d10;color:#e8ecf1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#v{width:100%;height:100%;object-fit:contain;display:block;background:#0b0d10}
#hud,#bot{position:fixed;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;pointer-events:none}
#hud{top:0;align-items:flex-start;padding-bottom:20px;background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0))}
#bot{bottom:0;align-items:flex-end;padding-top:20px;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0))}
#hud>div{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:12px;line-height:1.5;background:rgba(20,24,30,.72);border:1px solid rgba(255,255,255,.075);letter-spacing:.2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#8b96a5;flex:none;transition:background .25s}
.dot.ok{background:#35d07f;box-shadow:0 0 6px rgba(53,208,127,.8)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.7;color:#ef5350}
</style></head><body>
<div id="wrap"><img id="v" alt="camera"></div>
<div id="hud">
<div><span class="pill"><i class="dot" id="dot"></i><span id="state">连接中</span></span><span class="pill" id="res">—</span></div>
<span class="pill" id="fps">0.0 fps</span>
</div>
<div id="bot"><span class="pill" id="size">—</span><span class="pill" id="rx">0 KB</span></div>
<div id="err"></div>
<script>
var v=document.getElementById('v'),fpsEl=document.getElementById('fps'),resEl=document.getElementById('res'),sizeEl=document.getElementById('size'),rxEl=document.getElementById('rx'),st=document.getElementById('state'),dotEl=document.getElementById('dot'),er=document.getElementById('err');
var frames=0,total=0,lastSize=0,t0=performance.now(),lastUrl=null,running=false;
function fmtK(n){return n<1024?n+' B':(n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB');}
function setState(s,ok){st.textContent=s;if(ok){dotEl.className='dot ok';}else{dotEl.className='dot';}}
function showFrame(u8){
var url=URL.createObjectURL(new Blob([u8],{type:'image/jpeg'}));
v.src=url;var old=lastUrl;lastUrl=url;
if(old){setTimeout(function(){URL.revokeObjectURL(old);},800);}
frames++;total+=u8.length;lastSize=u8.length;
}
function scanEoh(b){var n=Math.min(b.length,512);
for(var i=0;i+3<n;i++){if(b[i]===13&&b[i+1]===10&&b[i+2]===13&&b[i+3]===10)return i+4;}
return -1;}
function contentLen(b,n){var s='';for(var i=0;i<n;i++)s+=String.fromCharCode(b[i]);
var m=/Content-Length:\s*(\d+)/i.exec(s);return m?parseInt(m[1],10):-1;}
async function run(){
if(running)return;running=true;
try{
var r=await fetch('/stream',{cache:'no-store'});
if(!r.ok||!r.body)throw new Error('http '+r.status);
setState('在线',true);er.style.display='none';
var rd=r.body.getReader(),buf=new Uint8Array(0);
while(true){
var q=await rd.read();
if(q.done)break;
var nb=new Uint8Array(buf.length+q.value.length);
nb.set(buf);nb.set(q.value,buf.length);buf=nb;
while(true){
var eoh=scanEoh(buf);if(eoh<0)break;
var len=contentLen(buf,eoh);if(len<=0||buf.length<eoh+len)break;
showFrame(buf.subarray(eoh,eoh+len));
buf=buf.subarray(eoh+len);
}
if(buf.length>262144)buf=new Uint8Array(0);
}
}catch(e){
setState('重连中…',false);
}
running=false;
setTimeout(run,1200);
}
setInterval(function(){
var now=performance.now(),dt=(now-t0)/1000;
if(dt>0){
fpsEl.textContent=(frames/dt).toFixed(1)+' fps';
if(lastSize>0){sizeEl.textContent=(lastSize/1024).toFixed(1)+' KB/帧';}
rxEl.textContent=fmtK(total);
}
if(v.naturalWidth>0){resEl.textContent=v.naturalWidth+'×'+v.naturalHeight;}
if(frames===0&&running){setState('等待画面…',false);}
frames=0;t0=now;
},1000);
run();
document.body.addEventListener('click',function(){
if(document.fullscreenElement){document.exitFullscreen();}
else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}});
</script></body></html>
